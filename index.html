<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌸 3D Botanical Oriental Lily — Mobile & Web Realtime 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.2">
</head>
<body>
  <!-- 3D WebGL Canvas Container -->
  <div id="canvas-container">
    <canvas id="webgl-canvas"></canvas>
    <div id="portrait-frame-guide" class="portrait-frame-guide" style="display: none;"></div>
  </div>

  <!-- UI Overlay (Tap canvas to toggle immersive fullscreen view) -->
  <div id="ui-overlay">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="greeting-badge">
        <div class="greeting-heading">
          <span class="greeting-flower">🌸</span>
          <span class="greeting-text">Good morning my little princess</span>
          <span class="greeting-sparkle">✨</span>
        </div>
        <p class="greeting-sub">Lilium Orientalis &bull; Blooming forever for you</p>
      </div>

      <div class="top-actions">
        <!-- Quick Lighting Switcher (Both Mobile & Desktop) -->
        <button id="lighting-mode-btn" class="glass-btn" title="Atmospheric Lighting">
          <span id="lighting-icon">🌅</span>
          <span id="lighting-label" class="desktop-only">Golden Hour</span>
        </button>

        <!-- Camera Mode Toggle (Both Mobile & Desktop) -->
        <button id="camera-mode-btn" class="glass-btn" title="Toggle 3D Orbit &bull; Cinematic Cam">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span id="camera-label" class="desktop-only">Cinematic Cam</span>
        </button>

        <!-- Desktop Quick Actions -->
        <button id="wind-toggle-btn" class="glass-btn active desktop-only" title="Toggle Living Breeze">
          <span>🍃</span>
          <span>Breeze</span>
        </button>

        <button id="dew-toggle-btn" class="glass-btn active desktop-only" title="Toggle Dewdrops">
          <span>💧</span>
          <span>Dewdrops</span>
        </button>

        <button id="wireframe-toggle-btn" class="glass-btn active desktop-only" title="Toggle Wireframe">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span>Wireframe</span>
        </button>

        <!-- Settings Drawer Toggle Button (Always visible on Mobile) -->
        <button id="drawer-open-btn" class="glass-btn" title="Open Settings & Customizations">
          <span>⚙️</span>
          <span class="desktop-only">Options</span>
        </button>
      </div>
    </header>

    <!-- Context Hint -->
    <div id="interaction-hint" class="interaction-hint">
      Tap screen to hide controls &bull; Drag to rotate in 3D
    </div>

    <!-- Bottom Player & Scrubber Bar -->
    <div class="bottom-control-bar">
      <div class="scrubber-row">
        <span id="current-time-label" class="time-label">0.0s</span>
        <div id="scrubber-track" class="scrubber-track">
          <div id="scrubber-fill" class="scrubber-fill"></div>
        </div>
        <span class="time-label" style="text-align: right;">13.0s</span>
      </div>

      <div class="controls-row">
        <div class="left-controls">
          <button id="play-pause-btn" class="icon-btn play-pause-btn" title="Play / Pause">
            <svg id="play-icon" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg id="pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>

          <button id="restart-btn" class="icon-btn" title="Restart animation">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
          </button>

          <button id="speed-btn" class="glass-btn" style="padding: 6px 12px; font-size: 11px;" title="Playback Speed">
            <span id="speed-label">1.0x</span>
          </button>
        </div>

        <div class="right-controls">
          <span style="font-size: 11px; color: #d4b0c2; font-weight: 500;">
            60 FPS &bull; Realtime 3D
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Settings Drawer Sheet -->
  <div id="mobile-drawer" class="mobile-drawer-overlay">
    <div class="mobile-drawer-sheet">
      <div class="drawer-header">
        <h3>⚙️ Botanical Options</h3>
        <button id="drawer-close-btn" class="drawer-close-btn">&times;</button>
      </div>

      <div class="drawer-options">
        <div class="drawer-row">
          <span>🌅 Atmosphere</span>
          <button id="drawer-lighting-btn" class="glass-btn">
            <span id="drawer-lighting-label">Golden Hour</span>
          </button>
        </div>

        <div class="drawer-row">
          <span>🍃 Living Breeze</span>
          <button id="drawer-wind-btn" class="glass-btn active">Enabled</button>
        </div>

        <div class="drawer-row">
          <span>💧 Morning Dewdrops</span>
          <button id="drawer-dew-btn" class="glass-btn active">Enabled</button>
        </div>

        <div class="drawer-row">
          <span>📐 Wireframe Blueprint</span>
          <button id="drawer-wire-btn" class="glass-btn active">Enabled</button>
        </div>

        <div class="drawer-row">
          <span>📱 9:16 Reel Guide</span>
          <button id="drawer-frame-btn" class="glass-btn">Disabled</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Standalone Three.js & OrbitControls -->
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <!-- Application Engine -->
  <script src="lily_botanical.js?v=2.2"></script>
</body>
</html>
